<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Himanshu&Deepika | Pre-Wedding Shoot - DHT </title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #03060a; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }
  
  .scene { width: 100vw; height: 100vh; perspective: 1200px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #101726 0%, #030508 100%); }
  
  .carousel-3d { position: relative; width: min(88vw, 420px); height: min(78vh, 680px); transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); }

  .card-3d { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; background: rgba(8, 12, 20, 0.88); backdrop-filter: blur(8px); border: 2px solid rgba(212,175,55,0.35); box-shadow: 0 15px 50px rgba(0,0,0,0.92); backface-visibility: hidden; transition: 0.8s cubic-bezier(0.25, 1, 0.5, 1); display: flex; align-items: center; justify-content: center; }
  .card-3d .img-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 6px; }
  .card-3d img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.7)); }

  /* 3D Dynamic Styles */
  .card-3d.active { transform: translateZ(0) rotateY(0deg); opacity: 1; z-index: 5; border-color: #d4af37; box-shadow: 0 0 35px rgba(212,175,55,0.4), 0 20px 60px rgba(0,0,0,0.95); }
  .card-3d.prev { transform: translateX(-40%) translateZ(-260px) rotateY(30deg); opacity: 0.35; z-index: 2; pointer-events: none; }
  .card-3d.next { transform: translateX(40%) translateZ(-260px) rotateY(-30deg); opacity: 0.35; z-index: 2; pointer-events: none; }
  .card-3d.hidden { transform: translateZ(-500px) opacity: 0; pointer-events: none; }

  /* Top Bar */
  .header { position: absolute; top: 0; left: 0; right: 0; padding: 20px 24px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 20; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); pointer-events: none; }
  .header h1 { font-size: 20px; color: #f5e08c; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
  .header p { font-size: 13px; color: #cbd5e1; margin-top: 2px; }
  .badge { background: rgba(212,175,55,0.18); border: 1px solid #d4af37; color: #f5e08c; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }

  /* Floating Screen Side Left / Right Buttons */
  .side-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.65); border: 1px solid rgba(212,175,55,0.5); color: #f5e08c; font-size: 20px; display: grid; place-items: center; cursor: pointer; z-index: 25; transition: 0.2s; backdrop-filter: blur(4px); }
  .side-btn:hover { background: #d4af37; color: #000; box-shadow: 0 0 15px rgba(212,175,55,0.6); }
  .side-btn.left { left: 16px; }
  .side-btn.right { right: 16px; }

  /* Bottom Controls Footer */
  .footer { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; z-index: 20; background: linear-gradient(to top, rgba(0,0,0,0.92), transparent); }
  .counter { font-size: 13px; color: #e2e8f0; font-weight: 600; }
  
  .controls-group { display: flex; gap: 8px; align-items: center; }
  .btn-ctrl { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: 0.2s; font-size: 14px; }
  .btn-ctrl:hover { background: #d4af37; color: #000; border-color: #d4af37; }
  .speed-select { background: rgba(0,0,0,0.6); border: 1px solid rgba(212,175,55,0.4); color: #f5e08c; border-radius: 6px; padding: 6px 8px; font-size: 12px; outline: none; cursor: pointer; }

  /* Bottom Thumbnails Strip */
  .thumb-bar { display: flex; gap: 6px; overflow-x: auto; max-width: 440px; padding: 4px 2px; scrollbar-width: thin; }
  .thumb-pill { width: 36px; height: 36px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.3); opacity: 0.5; cursor: pointer; flex-shrink: 0; transition: 0.2s; }
  .thumb-pill.active { border-color: #d4af37; opacity: 1; transform: scale(1.08); box-shadow: 0 0 8px #d4af37; }
  .thumb-pill img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<div class="scene" id="mainScene">
  <div class="header">
    <div>
      <h1>Himanshu&Deepika</h1>
      <p>Pre-Wedding Shoot</p>
    </div>
    <div class="badge">DHT  · 3D VERTICAL</div>
  </div>

  <!-- Big Floating Left / Right Buttons -->
  <button class="side-btn left" onclick="prevSlide()" title="Previous (Left Arrow)">❮</button>
  <button class="side-btn right" onclick="nextSlide()" title="Next (Right Arrow)">❯</button>

  <div class="carousel-3d" id="carousel"></div>

  <div class="footer">
    <div class="counter" id="counter">1 / 10</div>

    <!-- Thumbnails Scrub Strip -->
    <div class="thumb-bar" id="thumbBar"></div>

    <div class="controls-group">
      <select class="speed-select" id="runtimeSpeed" onchange="changeSpeed(this.value)" title="Change AutoPlay Speed">
        <option value="1">1s (Fast)</option>
        <option value="2">2s</option>
        <option value="3" >3s</option>
        <option value="4" >4s</option>
        <option value="5" >5s (Slow)</option>
      </select>
      <button class="btn-ctrl" onclick="prevSlide()" title="Previous">❮</button>
      <button class="btn-ctrl" onclick="togglePlay()" id="playBtn" title="Play / Pause">❚❚</button>
      <button class="btn-ctrl" onclick="nextSlide()" title="Next">❯</button>
      <button class="btn-ctrl" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
    </div>
  </div>
</div>

  let duration = 2000;
  const animStyle = 'coverflow';
  let cur = 0;
  let isAuto = true;
  let timer = null;

  const carousel = document.getElementById('carousel');
  const counter = document.getElementById('counter');
  const playBtn = document.getElementById('playBtn');
  const thumbBar = document.getElementById('thumbBar');

  imgs.forEach((src, idx) => {
    const card = document.createElement('div');
    card.className = 'card-3d hidden';
    const wrap = document.createElement('div');
    wrap.className = 'img-wrap';
    const im = document.createElement('img');
    im.src = src;
    wrap.appendChild(im);
    card.appendChild(wrap);
    carousel.appendChild(card);

    const pill = document.createElement('div');
    pill.className = 'thumb-pill' + (idx === 0 ? ' active' : '');
    pill.innerHTML = '<img src="' + src + '">';
    pill.onclick = () => jumpTo(idx);
    thumbBar.appendChild(pill);
  });

  const cards = document.querySelectorAll('.card-3d');
  const pills = document.querySelectorAll('.thumb-pill');

  function render() {
    cards.forEach((c, idx) => {
      c.className = 'card-3d';
      c.style.transform = '';

      if (idx === cur) {
        c.classList.add('active');
        if (animStyle === 'zoom') c.style.transform = 'scale(1) translateZ(0)';
      } else if (idx === (cur - 1 + imgs.length) % imgs.length) {
        c.classList.add('prev');
        if (animStyle === 'flipbook') c.style.transform = 'translateX(-50%) rotateY(-70deg) translateZ(-100px)';
        else if (animStyle === 'cube') c.style.transform = 'translateX(-50%) rotateY(90deg) translateZ(150px)';
        else if (animStyle === 'zoom') c.style.transform = 'scale(0.8) translateZ(-250px) opacity(0.3)';
        else if (animStyle === 'coverflow') c.style.transform = 'translateX(-55%) rotateY(45deg) translateZ(-200px)';
      } else if (idx === (cur + 1) % imgs.length) {
        c.classList.add('next');
        if (animStyle === 'flipbook') c.style.transform = 'translateX(50%) rotateY(70deg) translateZ(-100px)';
        else if (animStyle === 'cube') c.style.transform = 'translateX(50%) rotateY(-90deg) translateZ(150px)';
        else if (animStyle === 'zoom') c.style.transform = 'scale(0.8) translateZ(-250px) opacity(0.3)';
        else if (animStyle === 'coverflow') c.style.transform = 'translateX(55%) rotateY(-45deg) translateZ(-200px)';
      } else {
        c.classList.add('hidden');
      }
    });

    pills.forEach((p, idx) => {
      p.classList.toggle('active', idx === cur);
      if (idx === cur) p.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });

    counter.textContent = (cur + 1) + ' / ' + imgs.length;
  }

  function nextSlide() {
    cur = (cur + 1) % imgs.length;
    render();
  }

  function prevSlide() {
    cur = (cur - 1 + imgs.length) % imgs.length;
    render();
  }

  function jumpTo(idx) {
    cur = idx;
    render();
  }

  function start() {
    stop();
    timer = setInterval(nextSlide, duration);
  }

  function stop() {
    if (timer) clearInterval(timer);
  }

  function togglePlay() {
    isAuto = !isAuto;
    if (isAuto) {
      playBtn.innerHTML = '❚❚';
      start();
    } else {
      playBtn.innerHTML = '►';
      stop();
    }
  }

  function changeSpeed(sec) {
    duration = parseFloat(sec) * 1000;
    if (isAuto) start();
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  }

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });

  // Mobile Touch Swipe support
  let touchStartX = 0;
  window.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
  window.addEventListener('touchend', (e) => {
    let diff = e.changedTouches[0].clientX - touchStartX;
    if (diff > 50) prevSlide();
    else if (diff < -50) nextSlide();
  });

  render();
  start();
</script>
